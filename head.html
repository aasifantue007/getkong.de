<!-- Cross-domain consent receiver. MUST be above the CookieScript snippet.
     Canonical source: apps/webflow/src/head/snippets.html
     If you edit this in Webflow, also update the repo. -->
<script>
  (function () {
    try {
      var match = location.search.match(/[?&]CookieScriptConsent=([^&]*)/);
      if (!match) return;
      var decodedValue;
      try {
        decodedValue = decodeURIComponent(match[1]);
      } catch (e) {
        return; // malformed token, bail
      }
      var expires = new Date();
      expires.setDate(expires.getDate() + 365);
      // domain=.getkong.de so shop.getkong.de can read the cookie written on www.getkong.de.
      // Without this attribute the cookie is host-only and CookieScript on shop shows the banner again.
      var domainAttr = /(^|\.)getkong\.de$/.test(location.hostname) ? '; domain=.getkong.de' : '';
      document.cookie = 'CookieScriptConsent=' + decodedValue
        + '; expires=' + expires.toUTCString()
        + '; path=/'
        + '; SameSite=Lax'
        + domainAttr
        + (location.protocol === 'https:' ? '; Secure' : '');
      var cleanSearch = location.search.replace(/[?&]CookieScriptConsent=[^&]*/, '').replace(/^&/, '?');
      if (cleanSearch === '?') cleanSearch = '';
      if (cleanSearch !== location.search) {
        history.replaceState(history.state, '', location.pathname + cleanSearch + location.hash);
      }
    } catch (e) {}
  })();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var REVIEWS = [
    {n:'Marta L.', c:'Berlin', a:'https://cdn.prod.website-files.com/6a4eaafb7f632b1029afbd92/6a4f841961304d3b9caa919a_avatar-marta.jpg', q:'Um 14 Uhr den Antrag gestellt, um kurz nach 15 Uhr war die Lieferung bereits da. So schnell und professionell hätte ich es nicht erwartet.'},

    {n:'Daniel P.', c:'München', a:'https://cdn.prod.website-files.com/6a4eaafb7f632b1029afbd92/6a54a953dd0bbf131365c471_avatar-daniel.jpg', q:'Alles lief digital und ohne Umwege. Genau das habe ich gesucht.'},
    {n:'Mira T.', c:'Düsseldorf', a:'https://cdn.prod.website-files.com/6a4eaafb7f632b1029afbd92/6a54a95c00b9a2a6ce3a29c9_avatar-mira.jpg', q:'Die Lieferung kam pünktlich und war so diskret verpackt, dass ich mir darüber wirklich keine Gedanken machen musste. Für mich war das sehr angenehm.'},

    {n:'Mehmet A.', c:'Hannover', a:'https://cdn.prod.website-files.com/6a4eaafb7f632b1029afbd92/6a54a96090c3dfa2b7aa6913_avatar-mehmet.jpg', q:'Mir war wichtig, dass alles legal, diskret und nachvollziehbar abläuft. Genau diesen Eindruck hatte ich während des gesamten Prozesses.'},
    {n:'Clara W.', c:'Leipzig', a:'https://cdn.prod.website-files.com/6a4eaafb7f632b1029afbd92/6a54a956f05cb9b01235b54b_avatar-clara.jpg', q:'Kein Papierkram, kein Hin und Her. Der digitale Ablauf hat mir viel Zeit gespart.'}
  ];
  // ===================================================================
  var slider = document.querySelector('.gk-tslider'); if (!slider) return;
  var track = slider.querySelector('.gk-ttrack');
  var dotsWrap = slider.querySelector('.gk-tdots');
  function initials(n){ return n.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
  track.innerHTML = REVIEWS.map(function(r){
    var av = r.a ? '<img class="gk-card-avatar" src="'+r.a+'" alt="'+r.n+'"/>'
                 : '<div class="gk-card-avatar gk-card-initials">'+initials(r.n)+'</div>';
    return '<div class="gk-card gk-tcard">'+av+
      '<p class="gk-quote">„'+r.q+'“</p>'+
      '<div class="gk-card-meta"><div class="gk-card-name">'+r.n+'</div>'+
      '<div class="gk-card-loc">Verifizierte Behandlung · '+r.c+'</div></div></div>';
  }).join('');
  var cards = [].slice.call(track.children), current = 0, timer;
  function perView(){ var w = window.innerWidth; return w <= 767 ? 1 : (w <= 991 ? 2 : 3); }
  function groups(){ return Math.max(1, Math.ceil(cards.length / perView())); }
  function render(){
    var g = groups(); if (current > g-1) current = g-1;
    var first = cards[current * perView()];
    var base = cards.length ? cards[0].offsetLeft : 0;
    track.style.transform = 'translateX(' + (-((first ? first.offsetLeft : 0) - base)) + 'px)';
    var d = dotsWrap.children; for (var k=0;k<d.length;k++) d[k].className = 'gk-tdot' + (k===current?' gk-tdot-active':'');
  }
  function buildDots(){ dotsWrap.innerHTML=''; for (var k=0;k<groups();k++){ var dot=document.createElement('div'); dot.className='gk-tdot'; (function(i){ dot.addEventListener('click', function(){ current=i; render(); start(); }); })(k); dotsWrap.appendChild(dot);} render(); }
  function next(){ current=(current+1)%groups(); render(); }
  function start(){ clearInterval(timer); timer=setInterval(next, 4500); }
  slider.addEventListener('mouseenter', function(){ clearInterval(timer); });
  slider.addEventListener('mouseleave', start);
  function prev(){ current=(current-1+groups())%groups(); render(); }
  var tsx=0, tsy=0, sw=false;
  slider.addEventListener('touchstart', function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; sw=true; clearInterval(timer); }, {passive:true});
  slider.addEventListener('touchend', function(e){ if(!sw) return; sw=false; var t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy; if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); } start(); }, {passive:true});
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(buildDots, 150); });
  buildDots(); start();
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var items = [].slice.call(document.querySelectorAll('.gk-acc2'));
  function close(it){ it.classList.remove('gk-open'); it.querySelector('.gk-acc2-body').style.maxHeight = '0px'; }
  function open(it){ it.classList.add('gk-open'); var b = it.querySelector('.gk-acc2-body'); b.style.maxHeight = b.scrollHeight + 'px'; }
  items.forEach(function (it) {
    close(it);
    it.querySelector('.gk-acc2-head').addEventListener('click', function () {
      var wasOpen = it.classList.contains('gk-open');
      items.forEach(close);
      if (!wasOpen) open(it);
    });
  });
  /* start with all FAQ items closed */
});
</script>
