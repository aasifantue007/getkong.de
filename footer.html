<!-- (B) PROCESS CARDS: all images visible, no hover, scroll highlights 1-2-3-4 -->
<style>
/* every card shows its image */
.gk-proc .gk-step .gk-step-img { display: block !important; }
/* default (dim) state */
.gk-steps .gk-step { border-color: rgba(194,230,126,.3) !important; transition: border-color .4s ease, transform .4s ease; }
.gk-steps .gk-step .gk-step-num, .gk-steps .gk-step .gk-step-title { opacity: .4; transition: opacity .4s ease; }
/* highlighted (active) card */
.gk-steps .gk-step.gk-active { border-color: #C2E67E !important; transform: translateY(-6px); }
.gk-steps .gk-step.gk-active .gk-step-num, .gk-steps .gk-step.gk-active .gk-step-title { opacity: 1; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var steps = [].slice.call(document.querySelectorAll('.gk-steps .gk-step'));
  if (!steps.length) return;
  var section = document.querySelector('.gk-proc') || steps[0].parentNode;
  var ticking = false;
  function upd(){
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var vc = vh / 2;
    // detect stacked (mobile) vs side-by-side row (desktop)
    var r0 = steps[0].getBoundingClientRect();
    var r1 = steps.length > 1 ? steps[1].getBoundingClientRect() : r0;
    var stacked = Math.abs(r1.top - r0.top) > 20;
    var idx = 0;
    if (stacked) {
      // highlight the card whose centre is nearest the viewport centre
      var bestD = Infinity;
      steps.forEach(function(s, i){
        var r = s.getBoundingClientRect();
        var d = Math.abs((r.top + r.height / 2) - vc);
        if (d < bestD) { bestD = d; idx = i; }
      });
    } else {
      // desktop: cycle 1..4 as the section passes through the viewport
      var rs = section.getBoundingClientRect();
      var centre = rs.top + rs.height / 2;
      var p = (vh * 0.85 - centre) / (vh * 0.7);
      p = Math.max(0, Math.min(0.9999, p));
      idx = Math.floor(p * steps.length);
    }
    if (idx > steps.length - 1) idx = steps.length - 1;
    steps.forEach(function(s, i){ s.classList.toggle('gk-active', i === idx); });
    ticking = false;
  }
  window.addEventListener('scroll', function(){ if (!ticking){ requestAnimationFrame(upd); ticking = true; } }, { passive: true });
  window.addEventListener('resize', upd, { passive: true });
  upd();
});
</script>

<!-- (C) CLOUDS (stronger/faster, alternating L/R) + VEGGIE SCROLL + LOGO SCROLL -->
<style>
/* clouds are static (no float/breathing) at every breakpoint — they only drift on scroll */
.gk-cloud { animation: none !important; will-change: auto; }
.gk-cloud-img { will-change: transform; }
.gk-cloud-img, .gk-deco-broc-tr, .gk-deco-broc-bl { will-change: transform; }
@media (prefers-reduced-motion: reduce){
  .gk-cloud{ animation:none; }
  .gk-cloud-img,.gk-deco-outline-tl,.gk-deco-outline-br,.gk-deco-broc-tr,.gk-deco-broc-bl{ transform:none !important; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var clouds = [].slice.call(document.querySelectorAll('.gk-cloud'));
  clouds.forEach(function (c, i) {
    c.style.animationDuration = (6 + (i % 4)) + 's';
    c.style.animationDelay = (-(i * 1.3)) + 's';
    c.setAttribute('data-dir', (i % 2 === 0) ? -1 : 1);
    c.setAttribute('data-speed', (0.20 + (i % 3) * 0.06).toFixed(3));
  });
  var logos = [].slice.call(document.querySelectorAll('.gk-deco-outline-tl, .gk-deco-outline-br'));
  var ticking = false;
  function apply() {
    var vh = window.innerHeight || document.documentElement.clientHeight;
    clouds.forEach(function (c) {
      var img = c.querySelector('.gk-cloud-img') || c;
      var r = c.getBoundingClientRect();
      var delta = (r.top + r.height / 2) - vh / 2;
      var s = parseFloat(c.getAttribute('data-speed')) || 0.12;
      var dir = parseFloat(c.getAttribute('data-dir')) || -1;
      img.style.transform = 'translateX(' + (dir * -delta * s).toFixed(1) + 'px)';
    });
    logos.forEach(function (el) {
      var sec = el.closest('.gk-proc') || el;
      var r = sec.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
      el.style.transform = 'translateX(' + ((0.5 - p) * 320) + 'px)';
    });
    ticking = false;
  }
  if (!reduce) {
    window.addEventListener('resize', apply, { passive: true });
    var vegs = [].slice.call(document.querySelectorAll('.gk-deco-broc-tr, .gk-deco-broc-bl'));
    /* ONE continuous requestAnimationFrame loop drives clouds + logos + veggies
       every frame. This replaces the old scroll-event listener: on iOS, scroll
       events are throttled during momentum scrolling, which made the cloud drift
       start late and jump/jitter. A per-frame loop reads live positions and is
       smooth on every device. Works at all breakpoints (no width gate). */
    (function loop(){
      apply();
      var vh = window.innerHeight || 800, t = Date.now();
      vegs.forEach(function (el, i) {
        var sec = el.closest('.gk-proc') || el;
        var r = sec.getBoundingClientRect();
        var p = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
        var dir = (i % 2 === 0) ? 1 : -1;
        el.style.transform = 'translateX(' + (dir*(p-0.5)*150).toFixed(1) + 'px) translateY(' + (Math.sin(t/700+i)*-14).toFixed(1) + 'px)';
      });
      requestAnimationFrame(loop);
    })();
  }
});
</script>

<!-- (D) STAT COUNTERS (count up when section enters view) -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  var nums=[].slice.call(document.querySelectorAll('.gk-stat-num')); if(!nums.length) return;
  var cfg=[{s:110,e:210,f:function(v){return Math.round(v)+'K+';}},
           {s:20,e:50,f:function(v){return Math.round(v)+'K+';}},
           {s:3.2,e:4.8,f:function(v){return v.toFixed(1).replace('.',',');}},
           {s:5,e:15,f:function(v){return Math.round(v)+'+';}}];
  var done=false;
  function run(){ if(done)return; done=true;
    nums.forEach(function(el,i){ var c=cfg[i]; if(!c)return; var dur=1600,t0=null;
      function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur); var e=1-Math.pow(1-p,3);
        el.textContent=c.f(c.s+(c.e-c.s)*e); if(p<1)requestAnimationFrame(step); }
      requestAnimationFrame(step); });
  }
  var target=document.querySelector('.gk-stats')||nums[0];
  if('IntersectionObserver' in window){ new IntersectionObserver(function(es,o){es.forEach(function(e){if(e.isIntersecting){run();o.disconnect();}});},{threshold:.4}).observe(target); }
  else run();
});
</script>

</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  if(!('IntersectionObserver' in window)) return;
  var sels=['.gk-trustbar','.gk-testi-head','.gk-stats','.gk-cards','.gk-proc-head','.gk-steps','.gk-lab-left','.gk-partner-img-wrap','.gk-partner-right','.gk-faq-left','.gk-faq-img-wrap','.gk-about-img-wrap','.gk-cta-band-head'];

<!-- (G) HEADER + FOOTER LOGO -> HOME -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  var logo = document.querySelector('.gk-nav .gk-logo') || document.querySelector('.gk-logo');
  if (logo){
    if (logo.tagName === 'A'){ logo.setAttribute('href','/'); }
    else { logo.style.cursor='pointer'; logo.addEventListener('click', function(){ window.location.href='/'; }); }
  }
  var flogos = [].slice.call(document.querySelectorAll('.gk-footer-logo'));
  flogos.forEach(function(fl){
    if (fl.tagName === 'A'){ fl.setAttribute('href','/'); }
    else { fl.style.cursor = 'pointer'; fl.addEventListener('click', function(){ window.location.href='/'; }); }
  });
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.gk-mmenu-logo')){ window.location.href='/'; }
  });
});
</script>

<!-- (I) TRUST BADGES: full-width right-to-left marquee -->
<style>
.gk-trustbar { overflow: hidden; padding-left: 0 !important; padding-right: 0 !important; justify-content: flex-start !important; flex-wrap: nowrap !important; }
.gk-trust-track { display: flex; flex-wrap: nowrap; align-items: center; width: max-content; will-change: transform; animation: gkMarquee 36s linear infinite; }
.gk-trust-track > * { margin-right: 24px; flex: 0 0 auto; }
/* thinner badge outline */
.gk-badge { border-width: 1px !important; }
@keyframes gkMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var bar = document.querySelector('.gk-trustbar');
  if (!bar || bar.querySelector('.gk-trust-track')) return;
  var track = document.createElement('div');
  track.className = 'gk-trust-track';
  while (bar.firstChild) { track.appendChild(bar.firstChild); }
  [].slice.call(track.children).forEach(function(n){ track.appendChild(n.cloneNode(true)); });
  bar.appendChild(track);
});
</script>

<!-- (J) LIVE TRUSTPILOT WIDGET replaces the static pill (Home + Home V2) -->
<script type="text/javascript" src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var W = '<div class="trustpilot-widget" data-locale="de-DE" data-template-id="5419b637fa0340045cd0c936" data-businessunit-id="68495fb031ed1d653c6b58bf" data-style-height="28px" data-style-width="100%" data-token="d8e94af7-2a22-4acf-893a-8d5d59b23da2"><a href="https://www.trustpilot.com/review/www.getkong.de" target="_blank" rel="noopener">Trustpilot</a></div>';
  var pills = document.querySelectorAll('.gk-trustpill');
  if (!pills.length) return;
  pills.forEach(function (pill) {
    if (pill.dataset.tp) return; pill.dataset.tp = '1';
    pill.innerHTML = W;
    /* hug the widget content: flush-left inside the hero column on desktop,
       still centered under the logo on mobile (pill has margin:auto there) */
    pill.style.width = '250px';
    pill.style.minWidth = '0px';
    pill.style.background = 'transparent';
    pill.style.boxShadow = 'none';
    pill.style.padding = '0';
    pill.style.overflow = 'visible';
    pill.style.textAlign = 'left';
  });
  (function reinit(){
    if (window.Trustpilot) {
      document.querySelectorAll('.trustpilot-widget').forEach(function (w) { window.Trustpilot.loadFromElement(w, true); });
    } else { setTimeout(reinit, 400); }
  })();
});
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const menuLinks = document.querySelectorAll('.nav_link');
    const menuButton = document.querySelector('.navbar_menu-button');

    function enableMobileMenuClose() {
      menuLinks.forEach((link) => link.addEventListener('click', closeMenuOnClick));
    }

    function disableMobileMenuClose() {
      menuLinks.forEach((link) => link.removeEventListener('click', closeMenuOnClick));
    }

    function closeMenuOnClick() {
      setTimeout(() => {
        if (menuButton) menuButton.click();
      }, 100);
    }

    function checkBreakpoint() {
      if (window.innerWidth <= 991) {
        enableMobileMenuClose();
      } else {
        disableMobileMenuClose();
      }
    }

    checkBreakpoint();
    window.addEventListener('resize', checkBreakpoint);
  });
</script>
