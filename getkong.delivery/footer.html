<script>
document.addEventListener('DOMContentLoaded', function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var clouds = [].slice.call(document.querySelectorAll('.gk-cloud, .gk-cloud-2'));
  var logos  = [].slice.call(document.querySelectorAll('.gk-deco-outline-tl, .gk-deco-outline-br'));
  var vegs   = [].slice.call(document.querySelectorAll('.gk-deco-broc-tr, .gk-deco-broc-bl'));
  if (!clouds.length && !logos.length && !vegs.length) return;
  clouds.forEach(function (c, i) {
    c.setAttribute('data-dir',   (i % 2 === 0) ? -1 : 1);
    c.setAttribute('data-speed', (0.20 + (i % 3) * 0.06).toFixed(3));
  });
  function apply() {
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var t  = Date.now();
    clouds.forEach(function (c) {
      var img = c.querySelector('.gk-cloud-img') || c;
      var r   = c.getBoundingClientRect();
      var delta = (r.top + r.height / 2) - vh / 2;
      var s   = parseFloat(c.getAttribute('data-speed')) || 0.12;
      var dir = parseFloat(c.getAttribute('data-dir'))   || -1;
      img.style.transform = 'translateX(' + (dir * -delta * s).toFixed(1) + 'px)';
    });
    logos.forEach(function (el) {
      var sec = el.closest('.gk-proc') || el;
      var r = sec.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
      el.style.transform = 'translateX(' + ((0.5 - p) * 320).toFixed(1) + 'px)';
    });
    vegs.forEach(function (el, i) {
      var sec = el.closest('.gk-proc') || el;
      var r = sec.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
      var dir = (i % 2 === 0) ? 1 : -1;
      el.style.transform = 'translateX(' + (dir * (p - 0.5) * 150).toFixed(1) + 'px) translateY(' + (Math.sin(t / 700 + i) * -14).toFixed(1) + 'px)';
    });
  }
  (function loop(){ apply(); requestAnimationFrame(loop); })();
  window.addEventListener('resize', apply, { passive: true });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var steps = [].slice.call(document.querySelectorAll('.gk-steps .gk-step'));
  if (!steps.length) return;
  var section = document.querySelector('.gk-proc') || steps[0].parentNode;
  var ticking = false;
  function upd(){
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var vc = vh / 2;
    var r0 = steps[0].getBoundingClientRect();
    var r1 = steps.length > 1 ? steps[1].getBoundingClientRect() : r0;
    var stacked = Math.abs(r1.top - r0.top) > 20;
    var idx = 0;
    if (stacked) {
      var bestD = Infinity;
      steps.forEach(function(s, i){
        var r = s.getBoundingClientRect();
        var d = Math.abs((r.top + r.height / 2) - vc);
        if (d < bestD) { bestD = d; idx = i; }
      });
    } else {
      var rs = section.getBoundingClientRect();
      var centre = rs.top + rs.height / 2;
      var p = (vh * 0.85 - centre) / (vh * 0.7);
      p = Math.max(0, Math.min(0.9999, p));
      idx = Math.floor(p * steps.length);
    }
    if (idx > steps.length - 1) idx = steps.length - 1;
    steps.forEach(function(s, i){ s.classList.toggle('gk-active', i === idx); });
    ticking = false;
  }
  window.addEventListener('scroll', function(){
    if (!ticking){ requestAnimationFrame(upd); ticking = true; }
  }, { passive: true });
  window.addEventListener('resize', upd, { passive: true });
  upd();
});
</script>

});

<style>
/* ===== MOBILE HERO FILLS THE PHONE SCREEN =====================
   The hero measured 642px against an 844px viewport, so the dark
   green .gk-proc section showed through below the fold on load
   and read as a stray band rather than the next section.

   Three rules:
     min-height  - grow the hero to one screen so the green sits
                   just past the fold. Nothing is hidden.
     flex:0 0 auto on .gk-hero-body - stop the body absorbing the
                   extra height. It centres its own children, so
                   if it grows the logo, broccoli, headline and
                   CTA all drift downward. Pinned, they stay put.
     margin-top:auto on .gk-trustbar - send the new space between
                   the CTA and the badge carousel, and park the
                   carousel just above the fold.

   svh, NOT vh, is what keeps the carousel visible. 100vh on a
   phone means the viewport WITH THE ADDRESS BAR HIDDEN, ~100px
   taller than what is actually on screen at load, so the hero
   bottom - and the carousel sitting on it - falls underneath the
   browser toolbar. 100svh is the small viewport, exactly what is
   visible while the bar is shown. The plain 100vh line is a
   fallback for browsers without svh.

   MUST stay after the 1280px block above, which sets its own
   min-height for desktop. This one is scoped to <=767px only.

   Measured at 390x844: body top 78px, CTA ends 538px, carousel
   754-804px, green starts 844px. Carousel in view, green not.
   ============================================================ */
@media (max-width: 767px) {
  .gk-hero-2    { min-height: 100vh !important; min-height: 100svh !important; }
  .gk-hero-body { flex: 0 0 auto !important; }

}

<!-- ============================================================
     SECTION CLOUDS — SCROLL DRIFT
     Paste at the END of the existing Footer Code.
     APPEND ONLY. Safe to paste twice (guarded).

     WHY THE SECTION CLOUDS NEVER MOVED
     The existing drift script selects:
         document.querySelectorAll('.gk-cloud, .gk-cloud-2')
     The hero clouds carry .gk-cloud, so they are picked up and
     animated. The clouds in the later sections carry .bl-cloud --
     a different class that selector never matches. They were
     never given data-speed, never given a transform, and so have
     always been completely static.

     Verified on the live page:
         .gk-cloud / .gk-cloud-2   5 elements, 5 with data-speed
         .bl-cloud                 6 elements, 0 with data-speed
                                   6 inline transforms = "(none)"

     WHAT THIS DOES
     Runs the SAME maths on .bl-cloud so the motion is identical
     in character to the hero -- same delta formula, same speed
     band, same alternating direction. Nothing about the hero
     behaviour changes.

     TWO DELIBERATE DIFFERENCES FROM THE ORIGINAL

     1. Scroll listener as well as requestAnimationFrame.
        The original relies on rAF alone. Chrome throttles rAF to
        zero in a background or hidden tab, so the drift silently
        stops and only resumes on refocus. Listening to scroll as
        well means the position is always correct.

     2. The shift is clamped to +/-90px.
        delta grows without bound the further a cloud sits from the
        viewport centre, so on a long page an off-screen cloud can
        compute a shift of 400px or more. It corrects itself as you
        scroll toward it, but the clamp keeps the motion in the
        subtle range the design intends and stops any cloud being
        flung outside its section.

     Respects prefers-reduced-motion, matching the original.
     ============================================================ -->
<script>
(function () {
  if (window.__blCloudDrift) return;          // already installed
  window.__blCloudDrift = true;

  function ready(fn){ document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }

  ready(function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var clouds = [].slice.call(document.querySelectorAll('.bl-cloud'));
    if (!clouds.length) return;

    var MAX = 90;   // px, clamp

    clouds.forEach(function (c, i) {
      c.setAttribute('data-bl-dir',   (i % 2 === 0) ? -1 : 1);
      c.setAttribute('data-bl-speed', (0.20 + (i % 3) * 0.06).toFixed(3));
      var img = c.querySelector('.gk-cloud-img');
      if (img) img.style.willChange = 'transform';
    });

    var ticking = false;

    function apply() {
      var vh = window.innerHeight || document.documentElement.clientHeight;
      clouds.forEach(function (c) {
        var img = c.querySelector('.gk-cloud-img') || c;
        var r   = c.getBoundingClientRect();

        // skip anything nowhere near the viewport -- saves work on a long page
        if (r.bottom < -vh || r.top > vh * 2) return;

        var delta = (r.top + r.height / 2) - vh / 2;
        var s     = parseFloat(c.getAttribute('data-bl-speed')) || 0.20;
        var dir   = parseFloat(c.getAttribute('data-bl-dir'))   || -1;
        var shift = dir * -delta * s;

        if (shift >  MAX) shift =  MAX;
        if (shift < -MAX) shift = -MAX;

        img.style.transform = 'translateX(' + shift.toFixed(1) + 'px)';
      });
      ticking = false;
    }

    function request() {
      if (!ticking) { ticking = true; requestAnimationFrame(apply); }
    }

    window.addEventListener('scroll', request, { passive: true });
    window.addEventListener('resize', request, { passive: true });
    apply();
  });
})();
</script>
